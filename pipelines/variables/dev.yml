# Environment: dev (only active environment)
variables:
  environment: dev
  # One service connection per environment (prod gets sc-krtrun-prod in prod.yml)
  serviceConnection: sc-krtrun-dev
  # APIM CORS origins, comma-separated. Add the frontend URL (output swaUrl of the app stack);
  # Static Web Apps gets a new random hostname each time it is recreated.
  allowedOrigins: http://localhost:5173
