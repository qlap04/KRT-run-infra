# Environment: prod  (prod: dedicated resources)
# Resource names here must match bicep/env/prod.bicepparam.
variables:
  environment: prod              # -> APP_ENV
  resourceEnv: prod             # resource name set: dev | prod
  prefix: krtrun
  serviceConnection: sc-krtrun-dev   # Azure Resource Manager service connection (workload identity federation)
  resourceGroup: rg-krtrun-prod
  location: australiaeast
  # subscriptionId (plain) and secrets (SESSION_SECRET, ADMIN_CODE, API_KEY) live in the Azure DevOps variable group krtrun-prod,
  # NOT in the repo. The group is loaded in templates/*.yml.
