# KRT-run provision (repo: infra): app stack (bicep/stacks/30-app). Order: provision-network.yml, provision-data.yml, this, provision-apim.yml
name: krtrun-provision-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - bicep/stacks/30-app/**
    - bicep/modules/**
    - pipelines/provision.yml
    - pipelines/templates/**
    - pipelines/variables/**
pr: none

pool:
  vmImage: ubuntu-latest

# Shared by all environments. Env-specific variables are loaded per stage.
variables:
- template: variables/common.yml
- name: templateFile
  value: bicep/stacks/30-app/main.bicep

stages:
- stage: DeployDev
  displayName: Provision DEV
  # Service connection is set in variables/<env>.yml and read with
  # ${{ variables.serviceConnection }} (compile time; $(var) does not work there).
  variables:
  - template: variables/dev.yml
  - group: ${{ variables.projectName }}-${{ variables.environment }}   # per-env variable group: subscriptionId
  jobs:
  - deployment: Deploy
    displayName: Lint, what-if and deploy
    environment: ${{ variables.projectName }}-${{ variables.environment }}   # per-env approval gate
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/steps/bicep-deployment.yml
            parameters:
              deploymentName: $(projectName)-$(environment)-app-$(Build.BuildId)
              templateFile: ${{ variables.templateFile }}
              serviceConnection: ${{ variables.serviceConnection }}
              subscriptionId: $(subscriptionId)
              location: $(location)
              parameters:
                prefix: $(projectName)
                environment: $(environment)
                location: $(location)
                customDomain: $(customDomain)
