# KRT-run provision (repo: infra): network + app stack (main.bicep). APIM: provision-apim.yml
name: krtrun-provision-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - bicep/**
    - pipelines/**
    exclude:
    - pipelines/destroy.yml
    - pipelines/provision-apim.yml
    - bicep/apim.bicep
    - bicep/modules/compute/apim.bicep
    - bicep/env/apim-*.bicepparam
pr: none

pool:
  vmImage: ubuntu-latest

# Service connection is written as a literal below: it is resolved at
# compile time, so a $(variable) does not work there.
variables:
- template: variables/common.yml
- template: variables/dev.yml
- group: krtrun-dev
- name: parametersFile
  value: bicep/env/dev.bicepparam

stages:
- stage: Plan
  displayName: Plan (lint, what-if)
  jobs:
  - job: Build
    displayName: Lint and build-params
    steps:
    - checkout: self
    - template: templates/steps/bicep-validate.yml
      parameters:
        parametersFile: $(parametersFile)

  - job: WhatIf
    displayName: What-if
    dependsOn: Build
    steps:
    - checkout: self
    - template: templates/steps/bicep-whatif.yml
      parameters:
        serviceConnection: sc-krtrun-dev
        subscriptionId: $(subscriptionId)
        location: $(location)
        parametersFile: $(parametersFile)

- stage: DeployDev
  displayName: Provision DEV
  dependsOn: Plan
  jobs:
  - deployment: Deploy
    displayName: Deploy infra
    environment: krtrun-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/steps/bicep-deploy.yml
            parameters:
              deploymentName: $(projectName)-$(environment)-$(Build.BuildId)
              serviceConnection: sc-krtrun-dev
              subscriptionId: $(subscriptionId)
              location: $(location)
              parametersFile: $(parametersFile)
