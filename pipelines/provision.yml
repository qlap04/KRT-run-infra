# KRT-run provision (repo: infra): network, data and app stacks
# (bicep/stacks/10-network, 20-data, 30-app), then provision-apim.yml.
name: krtrun-provision-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - bicep/stacks/10-network/**
    - bicep/stacks/20-data/**
    - bicep/stacks/30-app/**
    - bicep/modules/**
    - pipelines/provision.yml
    - pipelines/templates/**
    - pipelines/variables/**
pr: none

pool:
  vmImage: ubuntu-latest

# Shared by all environments. Env-specific variables are loaded per stage.
variables:
- template: variables/common.yml

stages:
- stage: DeployDev
  displayName: Provision DEV
  # Service connection is set in variables/<env>.yml and read with
  # ${{ variables.serviceConnection }} (compile time; $(var) does not work there).
  variables:
  - template: variables/dev.yml
  - group: ${{ variables.projectName }}-${{ variables.environment }}   # per-env variable group: subscriptionId
  jobs:
  - deployment: Deploy
    displayName: Lint, what-if and deploy
    environment: ${{ variables.projectName }}-${{ variables.environment }}   # per-env approval gate
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          # Stack order network, data, app: each stack builds the ids of the previous ones from the same names.
          - template: templates/steps/bicep-deployment.yml
            parameters:
              deploymentName: $(projectName)-$(environment)-network-$(Build.BuildId)
              templateFile: ${{ 'bicep/stacks/10-network/main.bicep' }}
              serviceConnection: ${{ variables.serviceConnection }}
              subscriptionId: $(subscriptionId)
              location: $(location)
              parameters:
                prefix: $(projectName)
                environment: $(environment)
                location: $(location)
          - template: templates/steps/bicep-deployment.yml
            parameters:
              deploymentName: $(projectName)-$(environment)-data-$(Build.BuildId)
              templateFile: ${{ 'bicep/stacks/20-data/main.bicep' }}
              serviceConnection: ${{ variables.serviceConnection }}
              subscriptionId: $(subscriptionId)
              location: $(location)
              parameters:
                prefix: $(projectName)
                environment: $(environment)
                location: $(location)
          - template: templates/steps/bicep-deployment.yml
            parameters:
              deploymentName: $(projectName)-$(environment)-app-$(Build.BuildId)
              templateFile: ${{ 'bicep/stacks/30-app/main.bicep' }}
              serviceConnection: ${{ variables.serviceConnection }}
              subscriptionId: $(subscriptionId)
              location: $(location)
              parameters:
                prefix: $(projectName)
                environment: $(environment)
                location: $(location)
                customDomain: $(customDomain)
