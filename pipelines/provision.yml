# KRT-run provision (repo: infra): network + app stack (main.bicep). APIM: provision-apim.yml
name: krtrun-provision-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - bicep/**
    - pipelines/**
    exclude:
    - pipelines/destroy.yml
    - pipelines/provision-apim.yml
    - bicep/apim.bicep
    - bicep/modules/compute/apim.bicep
    - bicep/env/apim-*.bicepparam
pr: none

pool:
  vmImage: ubuntu-latest

# Service connection: per environment, set in variables/<env>.yml and read with
# ${{ variables.serviceConnection }} (compile time; $(var) does not work there).
variables:
- template: variables/common.yml
- template: variables/dev.yml
- group: krtrun-dev
- name: parametersFile
  value: bicep/env/dev.bicepparam

stages:
- stage: DeployDev
  displayName: Provision DEV
  jobs:
  - deployment: Deploy
    displayName: Lint, what-if and deploy
    environment: krtrun-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/steps/bicep-deployment.yml
            parameters:
              deploymentName: $(projectName)-$(environment)-$(Build.BuildId)
              serviceConnection: ${{ variables.serviceConnection }}
              subscriptionId: $(subscriptionId)
              location: $(location)
              parametersFile: $(parametersFile)
