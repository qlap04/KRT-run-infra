# KRT-run provision (repo: infra)
#
# develop → Plan (build, lint, what-if) → DEV
# Approval: Azure DevOps Environment krtrun-dev.
name: krtrun-provision-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - bicep/**
    - pipelines/**
    exclude:
    - pipelines/destroy.yml
pr: none

stages:
- stage: Plan
  displayName: Plan (build, lint, what-if)
  variables:
  - template: variables/common.yml
  - template: variables/dev.yml
  - group: krtrun-dev
  jobs:
  - template: templates/validate-bicep.yml
    parameters:
      environment: dev
      serviceConnection: sc-krtrun-dev

- template: templates/deploy-infra.yml
  parameters:
    stageName: DeployDev
    environment: dev
    serviceConnection: sc-krtrun-dev
    dependsOn: [Plan]
    condition: succeeded()
