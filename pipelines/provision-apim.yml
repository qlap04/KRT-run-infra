# KRT-run provision APIM (repo: infra): bicep/stacks/40-apim. No dependency on other stacks; CORS origins are derived from customDomain.
name: krtrun-provision-apim-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - bicep/stacks/40-apim/**
    - bicep/modules/**
    - pipelines/provision-apim.yml
    - pipelines/templates/**
    - pipelines/variables/**
pr: none

pool:
  vmImage: ubuntu-latest

# Shared by all environments. Env-specific variables are loaded per stage.
variables:
- template: variables/common.yml
- name: templateFile
  value: bicep/stacks/40-apim/main.bicep

stages:
- stage: DeployDev
  displayName: Provision APIM DEV
  variables:
  - template: variables/dev.yml
  - group: ${{ variables.projectName }}-${{ variables.environment }}   # per-env variable group: subscriptionId, GATEWAY_SECRET
  jobs:
  - deployment: Deploy
    displayName: Lint, what-if and deploy
    environment: ${{ variables.projectName }}-${{ variables.environment }}   # per-env approval gate
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/steps/bicep-deployment.yml
            parameters:
              deploymentName: $(projectName)-$(environment)-apim-$(Build.BuildId)
              templateFile: ${{ variables.templateFile }}
              serviceConnection: ${{ variables.serviceConnection }}
              subscriptionId: $(subscriptionId)
              location: $(location)
              parameters:
                prefix: $(projectName)
                environment: $(environment)
                location: $(location)
                publisherEmail: $(publisherEmail)
                publisherName: $(publisherName)
                # Compile time (dev.yml, not the variable group). When customDomain is
                # still empty, CORS falls back to the local Vite origin so the first
                # APIM provision has a valid origin.
                allowedOrigins: ${{ split(iif(eq(variables.customDomain, ''), 'http://localhost:5173', format('https://{0}', variables.customDomain)), ',') }}
                # Secret variable from the group: masked in the logs, never echoed
                gatewaySecret: $(GATEWAY_SECRET)
