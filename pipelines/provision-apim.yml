# KRT-run provision APIM (repo: infra): bicep/apim.bicep, run after provision.yml
name: krtrun-provision-apim-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - bicep/apim.bicep
    - bicep/modules/compute/apim.bicep
    - bicep/env/apim-*.bicepparam
    - pipelines/provision-apim.yml
pr: none

pool:
  vmImage: ubuntu-latest

# Shared by all environments. Env-specific variables are loaded per stage.
variables:
- template: variables/common.yml
- name: templateFile
  value: bicep/apim.bicep

stages:
- stage: DeployDev
  displayName: Provision APIM DEV
  variables:
  - template: variables/dev.yml
  - group: ${{ variables.projectName }}-${{ variables.environment }}   # per-env variable group: subscriptionId
  - name: parametersFile
    value: bicep/env/apim-dev.bicepparam
  jobs:
  - deployment: Deploy
    displayName: Lint, what-if and deploy
    environment: ${{ variables.projectName }}-${{ variables.environment }}   # per-env approval gate
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - template: templates/steps/bicep-deployment.yml
            parameters:
              deploymentName: $(projectName)-$(environment)-apim-$(Build.BuildId)
              templateFile: $(templateFile)
              serviceConnection: ${{ variables.serviceConnection }}
              subscriptionId: $(subscriptionId)
              location: $(location)
              parametersFile: $(parametersFile)
              secretEnv:
                GATEWAY_SECRET: $(GATEWAY_SECRET)
