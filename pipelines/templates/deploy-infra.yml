# Deploy infra for one environment (RG and what-if are done in the Plan stage).
parameters:
- name: stageName
  type: string
- name: environment
  type: string
- name: serviceConnection
  type: string
- name: dependsOn
  type: object
  default: []
- name: condition
  type: string
  default: succeeded()

stages:
- stage: ${{ parameters.stageName }}
  displayName: Provision ${{ upper(parameters.environment) }}
  dependsOn: ${{ parameters.dependsOn }}
  condition: ${{ parameters.condition }}
  variables:
  - template: ../variables/common.yml
  - template: ../variables/${{ parameters.environment }}.yml
  - group: krtrun-${{ parameters.environment }}
  jobs:
  - deployment: Deploy
    displayName: Deploy infra
    pool: { vmImage: $(vmImage) }
    environment: krtrun-${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: BicepDeploy@0
            displayName: Bicep deploy
            inputs:
              type: deployment
              operation: create
              name: krtrun-$(environment)-$(Build.BuildId)
              scope: resourceGroup
              azureResourceManagerConnection: ${{ parameters.serviceConnection }}
              subscriptionId: $(subscriptionId)
              resourceGroupName: $(resourceGroup)
              templateFile: bicep/main.bicep
              parametersFile: bicep/env/${{ parameters.environment }}.bicepparam
            env:
              SESSION_SECRET: $(SESSION_SECRET)
              ADMIN_CODE: $(ADMIN_CODE)
              API_KEY: $(API_KEY)
