# Step template: lint, what-if, then deploy (subscription scope).
# Use it only inside a deployment job that has the environment approval gate.
parameters:
- name: serviceConnection
  type: string

- name: subscriptionId
  type: string

- name: location
  type: string

- name: templateFile
  type: string

- name: deploymentName
  type: string
  default: bicep-$(Build.BuildId)

# Optional label prefixed on each step displayName (e.g. "Network" -> "Network: Lint").
# Empty by default so existing callers keep "Bicep lint", "Bicep what-if", "Bicep deploy".
- name: stepLabel
  type: string
  default: ''

# Bicep parameters as an object, e.g. { prefix: $(projectName), gatewaySecret: $(GATEWAY_SECRET) }.
# A secret variable passed as $(NAME) is masked in the logs.
- name: parameters
  type: object
  default: {}

steps:
# Lint has no built-in task: the Bicep CLI on the agent is the only option.
- script: az bicep lint --file ${{ parameters.templateFile }}
  displayName: "${{ iif(eq(parameters.stepLabel, ''), 'Bicep lint', format('{0}: Lint', parameters.stepLabel)) }}"

- task: BicepDeploy@0
  displayName: "${{ iif(eq(parameters.stepLabel, ''), 'Bicep what-if', format('{0}: What-if', parameters.stepLabel)) }}"
  inputs:
    type: deployment
    operation: whatIf
    scope: subscription
    azureResourceManagerConnection: ${{ parameters.serviceConnection }}
    subscriptionId: ${{ parameters.subscriptionId }}
    location: ${{ parameters.location }}
    templateFile: ${{ parameters.templateFile }}
    parameters: ${{ convertToJson(parameters.parameters) }}

- task: BicepDeploy@0
  displayName: "${{ iif(eq(parameters.stepLabel, ''), 'Bicep deploy', format('{0}: Deploy', parameters.stepLabel)) }}"
  inputs:
    type: deployment
    operation: create
    name: ${{ parameters.deploymentName }}
    scope: subscription
    azureResourceManagerConnection: ${{ parameters.serviceConnection }}
    subscriptionId: ${{ parameters.subscriptionId }}
    location: ${{ parameters.location }}
    templateFile: ${{ parameters.templateFile }}
    parameters: ${{ convertToJson(parameters.parameters) }}
