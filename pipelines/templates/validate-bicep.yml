# Plan stage jobs for one environment:
# - Build: lint main.bicep and build the env params (offline, no Azure call).
# - WhatIf: create the resource group if missing (empty RG is free), then
#   preview the changes. Nothing else is changed in Azure.
parameters:
- name: environment
  type: string
- name: serviceConnection
  type: string

jobs:
- job: Build
  displayName: Build and lint
  steps:
  - checkout: self
  - script: |
      set -e
      az bicep lint --file bicep/main.bicep
      az bicep build-params --file bicep/env/${{ parameters.environment }}.bicepparam --stdout > /dev/null
    displayName: Build and lint
    env:
      SESSION_SECRET: placeholder
      ADMIN_CODE: placeholder
      API_KEY: placeholder

- job: WhatIf
  displayName: What-if
  dependsOn: Build
  steps:
  - checkout: self
  - task: AzureCLI@3
    displayName: Ensure resource group
    inputs:
      connectedServiceNameARM: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az group create --name $(resourceGroup) --location $(location) \
          --tags project=$(projectName) env=$(environment) --output none
  - task: BicepDeploy@0
    displayName: Bicep what-if
    inputs:
      type: deployment
      operation: whatIf
      scope: resourceGroup
      azureResourceManagerConnection: ${{ parameters.serviceConnection }}
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroup)
      templateFile: bicep/main.bicep
      parametersFile: bicep/env/${{ parameters.environment }}.bicepparam
    env:
      SESSION_SECRET: $(SESSION_SECRET)
      ADMIN_CODE: $(ADMIN_CODE)
      API_KEY: $(API_KEY)
