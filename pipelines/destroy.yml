# KRT-run DESTROY — manual only (trigger: none).
# Safety: ADO Environment approval on krtrun-dev.
# Order: delete + purge APIM, then delete resource group.
name: krtrun-destroy-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# One agent image for every job; ubuntu-latest moves with Microsoft's images.
pool:
  vmImage: ubuntu-latest

stages:
- stage: Destroy
  displayName: Destroy DEV
  variables:
  - template: variables/common.yml
  - template: variables/dev.yml
  - group: krtrun-dev
  jobs:
  - deployment: Destroy
    displayName: Delete $(resourceGroup)
    environment: krtrun-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@3
            displayName: Delete & purge APIM
            inputs:
              connectedServiceNameARM: sc-krtrun-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -u
                APIM="$(projectName)-$(environment)-apim"
                if [ "`az group exists --name $(resourceGroup)`" != "true" ]; then
                  echo "RG $(resourceGroup) missing — nothing to delete."
                  exit 0
                fi
                echo "##vso[task.setvariable variable=rgExists]true"
                if az apim show --resource-group $(resourceGroup) --name "$APIM" --output none 2>/dev/null; then
                  az apim delete --resource-group $(resourceGroup) --name "$APIM" --yes
                  az apim deletedservice purge --service-name "$APIM" --location $(location) \
                    || echo "Purge skipped (already gone)."
                else
                  echo "No APIM $APIM."
                fi

          - task: AzureResourceManagerTemplateDeployment@3
            displayName: Delete RG $(resourceGroup)
            condition: eq(variables['rgExists'], 'true')
            inputs:
              deploymentScope: Resource Group
              action: DeleteRG
              azureResourceManagerConnection: sc-krtrun-dev
              subscriptionId: $(subscriptionId)
              resourceGroupName: $(resourceGroup)
