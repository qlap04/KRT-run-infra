# KRT-run DESTROY — manual only (trigger: none).
# Safety: ADO Environment approval on krtrun-dev.
# Order: delete + purge APIM, then delete the APIM and app resource groups.
name: krtrun-destroy-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# One agent image for every job; ubuntu-latest moves with Microsoft's images.
pool:
  vmImage: ubuntu-latest

stages:
- stage: Destroy
  displayName: Destroy DEV
  variables:
  - template: variables/common.yml
  - template: variables/dev.yml
  - group: krtrun-dev
  jobs:
  - deployment: Destroy
    displayName: Delete $(apimResourceGroup) and $(resourceGroup)
    environment: krtrun-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@3
            displayName: Delete & purge APIM, delete resource groups
            inputs:
              connectedServiceNameARM: sc-krtrun-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -u
                APIM="$(projectName)-$(environment)-apim"

                # 1. APIM: delete, then purge so the name can be reused next time.
                if az apim show --resource-group $(apimResourceGroup) --name "$APIM" --output none 2>/dev/null; then
                  az apim delete --resource-group $(apimResourceGroup) --name "$APIM" --yes
                  az apim deletedservice purge --service-name "$APIM" --location $(location) \
                    || echo "Purge skipped (already gone)."
                else
                  echo "No APIM $APIM."
                fi

                # 2. Resource groups (APIM RG first, then the app RG).
                for RG in $(apimResourceGroup) $(resourceGroup); do
                  if [ "`az group exists --name "$RG"`" = "true" ]; then
                    echo "Deleting $RG ..."
                    az group delete --name "$RG" --yes
                  else
                    echo "RG $RG missing, nothing to delete."
                  fi
                done
